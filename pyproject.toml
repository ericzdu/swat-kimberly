[project]
name = "swat-kimberly"
version = "0.1.0"
description = "Gymnasium environment and experiments on the calibrated SWAT+ Kimberly, ID GRACEnet field."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swat_gym"]

[project.optional-dependencies]
dev = ["pytest"]
rl = [
    "cma>=4.4.4",
    "gymnasium>=1.3.0",
    "stable-baselines3>=2.9.0",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]
testpaths = ["src/swat_gym/tests"]
markers = ["slow: longer engine runs"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
